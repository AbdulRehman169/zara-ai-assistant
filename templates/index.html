<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zara AI Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="mb-3">✨ Zara — Abdul's AI Assistant</h2>
            <a href="/history" class="btn btn-outline-secondary btn-sm mb-3">📜 View History</a>
            <a href="/start_new_conversation" class="btn btn-outline-secondary btn-sm mb-3">Start New Conversation</a>
            
            <form method="POST" action="/ask" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label" for="ai_model_select">Choose AI Model:</label>
                    <select id="ai_model_select" name="ai_model" class="form-select">
                        <option value="gemini">Gemini (Google) — Free</option>
                        <option value="groq">Groq — Fast</option>
                        <option value="tavily">Tavily — Web Search</option>
                    </select>
                </div>

                <!-- Dropdown 2: which prompt personality to use -->
                <div class="mb-3">P
                    <label class="form-label" for="prompt_mode_select">Choose Assistant Mode:</label>
                    <select id="prompt_mode_select" name="prompt_mode" class="form-select" aria-label="Choose Assistant Mode">
                        <option value="1">Default Assistant</option>
                        <option value="2">Reasoning Assistant (ReAct)</option>
                        <option value="3">Customer Classifier</option>
                        <option value="4">Code Reviewer</option>
                        <option value="5">Content Summarizer</option>
                        <option value="6">Email Writer</option>
                        <option value="7">Study Planner</option>
                        <option value="8">JSON Format</option>
                        <option value="9">Table Format</option>
                        <option value="10">Strict Assistant</option>
                    </select>
                </div>

                <!-- The question box -->
                <div class="mb-3">
                    <input type="text" name="question" class="form-control"
                           placeholder="Ask Zara something..." required
                           value="{{ question or '' }}">
                </div>
                <div class="mb-3">
                    <label for="image">Choose an image:</label><br>
                    <input id="image" type="file" name="image" accept="image/*" title="Select an image"><br><br>
                    <label for="image_question" class="form-label">Image question</label>
                    <input id="image_question" type="text" name="image_question" class="form-control" placeholder="Ask about the image..."><br><br>
                </div>
                <div class="mb-3">
                    <label for="pdf">Choose a PDF file</label><br>
                    <input id="pdf" type="file" name="pdf" accept="application/pdf" title="Select a PDF file">
                    <label for="pdf question" class="form-label"> Pdf question</label>
                    <input type="text" name="pdf_question" class="form-control" title="Enter a pdf question:" placeholder="Pdf Question">
                </div>

                <button type="submit" class="btn btn-primary">Ask</button>
            </form>

            {% if answer %}
            <div class="mt-4">
                <p><strong>You asked:</strong> {{ question }}</p>
                <p><strong>Zara says:</strong> {{ answer }}</p>
            </div>
            {% endif %}

        </div>
    </div>

</body>
</html>
